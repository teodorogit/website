# Local PostgreSQL: app DB on host port 5434, test DB on host port 5433.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brigadeiro
    # Loopback only: the dev superuser credentials must not be reachable from the network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brigadeiro_test
    ports:
      - "127.0.0.1:5433:5432"
volumes:
  postgres-data:
